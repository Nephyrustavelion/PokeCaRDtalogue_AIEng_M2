name: Deploy PokeCaRDtalogue

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_TCGDEX_API_BASE_URL: ${{ vars.VITE_TCGDEX_API_BASE_URL }}
          VITE_TCGDEX_API_CARDS_ENDPOINT: ${{ vars.VITE_TCGDEX_API_CARDS_ENDPOINT }}
          VITE_TCGDEX_API_CARD_LIMIT: ${{ vars.VITE_TCGDEX_API_CARD_LIMIT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
